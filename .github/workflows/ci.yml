name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (standard library only)
        run: python -I -m unittest discover -s tests -v
      - name: Generated agent copies match their sources
        run: python -I tools/sync_adapters.py --check
      - name: Every file on disk is covered by the write-zone map
        run: python -I tools/tree.py check
